  <div style="position:relative;width:424px;height:896px;flex:0 0 auto;border-radius:54px;padding:11px;background:linear-gradient(160deg, oklch(0.42 0.008 265), oklch(0.28 0.006 265));box-shadow:0 44px 90px -30px oklch(0.25 0.02 265 / 0.45), 0 0 0 1px oklch(0.20 0.01 265 / 0.35)">
